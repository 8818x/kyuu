<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Diary</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M8 25h32c0 10-7 17-16 17S8 35 8 25Z" stroke="currentColor" stroke-width="2.5"/>
        <path d="M5 25h38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="m17 15 6-9m3 9 6-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </span>
    <h1>Food Diary</h1>
    <p>A diary of Zhujiaofan &amp; Shaorou, one shop at a time.</p>
  </header>

  <nav id="tabs" aria-label="View"></nav>

  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

  <section id="map-panel">
    <p id="map-summary" class="summary"></p>
    <div id="map" role="region" aria-label="Shop map"></div>
  </section>

  <section id="diary-panel" hidden>
    <div id="filters" aria-label="Filter by dish"></div>
    <main id="cards"></main>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/entries.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
