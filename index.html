<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Diary</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header>
    <h1>Food Diary</h1>
    <p>Khao kha mu &amp; crispy pork, one shop at a time.</p>
  </header>

  <nav id="tabs" aria-label="View"></nav>

  <section id="map-panel">
    <div id="map" role="application" aria-label="Shop map"></div>
  </section>

  <section id="diary-panel" hidden>
    <div id="filters" aria-label="Filter by dish"></div>
    <main id="cards"></main>
  </section>

  <footer>
    Add a shop: edit <code>data/entries.js</code>. Put photos in <code>images/</code>.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/entries.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
