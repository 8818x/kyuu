<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyuu</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=40">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="binding" aria-hidden="true">
    <span class="binding-mark" role="img" aria-label="Kyuu — nine">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M32 8c-3 6-8 12-16 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M7 18h30c0 12-5 20-12 20-5 0-9-3-11-7" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="binding-folio">FOLIO</span>
    <span id="binding-number" class="binding-number">001</span>
    <span id="binding-tape" class="binding-tape" hidden></span>
  </div>

  <div class="page">
    <header class="masthead">
      <div class="masthead-row">
        <a class="wordmark" href="#/diary">Kyuu</a>
        <nav id="tabs" class="page-tabs" aria-label="View"></nav>
      </div>
      <div class="filter-row">
        <div id="filters" class="stamp-filters" aria-label="Filter by dish"></div>
        <p id="ledger-count" class="ledger-count"></p>
        <details class="glossary">
          <summary>Marks</summary>
          <div class="glossary-body">
            <p><b>写真</b> photo number</p>
            <p><b>FOLIO</b> page number</p>
            <p><b>九 / Kyuu</b> nine</p>
          </div>
        </details>
      </div>
    </header>

    <main id="main" class="content">
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

      <section id="diary-panel" aria-label="Diary">
        <div id="featured"></div>
        <div id="strip" class="print-strip" aria-label="Prints in this ledger"></div>
      </section>

      <section id="map-panel" hidden aria-label="Map of places">
        <div class="map-ledger">
          <aside class="ledger-list" aria-label="Place list">
            <button id="list-toggle" class="list-toggle" type="button" aria-expanded="true" aria-controls="list-body">
              <span>Places</span><span id="map-count" class="map-count"></span>
            </button>
            <div class="pin-legend" aria-label="Map pin key">
              <span class="pin-key"><svg viewBox="0 0 28 38" width="14" height="19" aria-hidden="true"><path d="M14 36.5S2.5 23.2 2.5 14a11.5 11.5 0 0 1 23 0c0 9.2-11.5 22.5-11.5 22.5Z" fill="currentColor" stroke="var(--paper)" stroke-width="2"/></svg>Zhujiaofan · Pad Thai / Hoi Tod</span>
              <span class="pin-key pin-key--crisp"><svg viewBox="0 0 26 26" width="15" height="15" aria-hidden="true"><rect x="4.5" y="4.5" width="17" height="17" rx="3" transform="rotate(45 13 13)" fill="currentColor" stroke="var(--paper)" stroke-width="2"/></svg>Shaorou</span>
            </div>
            <div id="list-body" class="list-body">
              <label class="search-field">
                <span class="visually-hidden">Search places</span>
                <input id="shop-search" type="search" placeholder="Search places" autocomplete="off">
              </label>
              <div id="shop-items" class="shop-items"></div>
            </div>
          </aside>
          <div class="map-area">
            <p id="map-error" class="map-error" hidden>The map tiles could not load. The list and diary still work.</p>
            <div id="map" role="region" aria-label="Shop map"></div>
          </div>
        </div>
      </section>

      <section id="entry-panel" hidden aria-label="Entry">
        <div id="entry-content"></div>
      </section>
    </main>
  </div>

  <div id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-shop" aria-hidden="true">
    <div class="sheet-inner">
      <button id="sheet-grip" class="sheet-grip" type="button" aria-label="Collapse details" aria-expanded="true">
        <span></span>
      </button>
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Close details">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="sheet-tag" class="dish-stamps"></div>
      <h2 id="sheet-shop" class="sheet-shop"></h2>
      <p id="sheet-date" class="sheet-date"></p>
      <div id="sheet-detail" class="sheet-detail">
        <div id="sheet-note" class="sheet-note"></div>
        <a id="sheet-link" class="ink-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Open in Google Maps</a>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photograph at full size" aria-hidden="true" hidden>
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close photograph">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="lightbox-image" class="lightbox-image"></div>
    <p class="lightbox-hint">Scroll or drag to explore the full-size photograph.</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/entries.js?v=40"></script>
  <script src="app.js?v=40"></script>
</body>
</html>
